name: server-ops

# Operations against the infrastructure, driven two ways:
#   1. push to ops/request.json  -> lets an automated agent (with push rights
#      but no actions:write) start a run by committing a request file.
#   2. workflow_dispatch          -> manual "Run workflow" button.
#
# The SSH private key comes from the repository secret K3S_DEPLOY_SSH_KEY
# (never commit the key itself).
#
# Runner:
#   * push events always use ubuntu-latest (reaches public hosts, e.g. 31.192.110.64).
#   * workflow_dispatch can pick a self-hosted label to reach the private
#     inventory (192.168.1.x).

on:
  push:
    branches:
      - claude/k3s-ansible-playbook-fne4cn
      - claude/server-connection-packages-46cvrt
    paths:
      - ops/request.json
  workflow_dispatch:
    inputs:
      task:
        description: "Operation to run"
        type: choice
        required: true
        default: apt-upgrade
        options:
          - apt-upgrade
          - ansible-playbook
      runner_label:
        description: "Runner to execute on (ubuntu-latest, or a self-hosted label)"
        type: string
        required: true
        default: ubuntu-latest
      target:
        description: "apt-upgrade only: SSH target (user@host)"
        type: string
        required: false
        default: root@31.192.110.64
      reboot_if_needed:
        description: "apt-upgrade only: reboot the host if the upgrade requires it"
        type: boolean
        required: false
        default: false

jobs:
  run:
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner_label || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve parameters
        id: p
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TASK='${{ inputs.task }}'
            TARGET='${{ inputs.target }}'
            REBOOT='${{ inputs.reboot_if_needed }}'
          else
            TASK=$(jq -r '.task // "apt-upgrade"' ops/request.json)
            TARGET=$(jq -r '.target // "root@31.192.110.64"' ops/request.json)
            REBOOT=$(jq -r '.reboot_if_needed // false' ops/request.json)
          fi
          echo "task=${TASK}"     >> "$GITHUB_OUTPUT"
          echo "target=${TARGET}" >> "$GITHUB_OUTPUT"
          echo "reboot=${REBOOT}" >> "$GITHUB_OUTPUT"
          echo "Resolved: task=${TASK} target=${TARGET} reboot=${REBOOT}"

      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.K3S_DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: apt upgrade
        if: ${{ steps.p.outputs.task == 'apt-upgrade' }}
        run: |
          set -euo pipefail
          TARGET='${{ steps.p.outputs.target }}'
          echo "::group::apt-get update && upgrade on ${TARGET}"
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new "${TARGET}" \
            'DEBIAN_FRONTEND=noninteractive apt-get update \
             && DEBIAN_FRONTEND=noninteractive apt-get -y -o Dpkg::Options::="--force-confold" upgrade'
          echo "::endgroup::"

          echo "::group::reboot check"
          NEEDS_REBOOT=$(ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new "${TARGET}" \
            'test -f /var/run/reboot-required && echo yes || echo no')
          echo "reboot-required: ${NEEDS_REBOOT}"
          if [ "${NEEDS_REBOOT}" = "yes" ] && [ "${{ steps.p.outputs.reboot }}" = "true" ]; then
            echo "Triggering reboot..."
            ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new "${TARGET}" \
              'nohup sh -c "sleep 2 && systemctl reboot" >/dev/null 2>&1 &' || true
            echo "Reboot requested."
          fi
          echo "::endgroup::"

      - name: ansible-playbook
        if: ${{ steps.p.outputs.task == 'ansible-playbook' }}
        working-directory: ansible/k3s-install
        run: |
          set -euo pipefail
          python3 -m pip install --quiet ansible
          ansible-playbook \
            --private-key ~/.ssh/id_ed25519 \
            -i inventory/hosts.ini \
            playbook.yml
