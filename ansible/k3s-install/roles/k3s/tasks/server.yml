---
- name: Check if k3s is already installed
  stat:
    path: "{{ k3s_install_dir }}/k3s"
  register: k3s_binary

- name: Download and run k3s server install script
  shell: >
    curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION={{ k3s_version }}
    INSTALL_K3S_EXEC="server {{ k3s_server_extra_args }}" sh -
  args:
    creates: "{{ k3s_install_dir }}/k3s"

- name: Ensure k3s service is enabled and running
  systemd:
    name: k3s
    enabled: true
    state: started

- name: Wait for node-token to be created
  wait_for:
    path: "{{ k3s_token_path }}"
    state: present
    timeout: 60

- name: Read node token
  slurp:
    src: "{{ k3s_token_path }}"
  register: k3s_node_token_raw

- name: Set node token fact for agents
  set_fact:
    k3s_node_token: "{{ k3s_node_token_raw.content | b64decode | trim }}"

- name: Fetch kubeconfig from server
  fetch:
    src: "{{ k3s_config_dir }}/k3s.yaml"
    dest: "./fetched/{{ inventory_hostname }}-kubeconfig.yaml"
    flat: true
